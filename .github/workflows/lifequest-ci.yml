name: LifeQuest CI
on:
  push:
    branches: [master, backend]
  pull_request:
    branches: [master, backend]
permissions:
  contents: read
jobs:
  android:
    if: github.ref_name == 'master' || (github.event_name == 'pull_request' && github.base_ref == 'master')
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and assemble debug APK
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug
  backend:
    if: github.ref_name == 'backend' || (github.event_name == 'pull_request' && github.base_ref == 'backend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifequest-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Spring Boot tests
        run: bash ./mvnw -B test
