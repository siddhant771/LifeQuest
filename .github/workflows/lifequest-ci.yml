name: LifeQuest Backend CI
on:
  push:
    branches: [backend]
  pull_request:
    branches: [backend]
permissions:
  contents: read
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lifequest-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        run: ./mvnw -B test
      - name: Package executable JAR
        run: ./mvnw -B -DskipTests package
      - name: Build Docker image
        run: docker build -t lifequest-api:ci .
