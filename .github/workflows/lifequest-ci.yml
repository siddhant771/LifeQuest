name: LifeQuest Android CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android API 37
        run: sdkmanager "platform-tools" "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run staging unit tests
        run: ./gradlew --no-daemon :app:testStagingDebugUnitTest
      - name: Assemble staging debug APK
        run: ./gradlew --no-daemon :app:assembleStagingDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lifequest-staging-debug
          path: app/build/outputs/apk/staging/debug/*.apk
          if-no-files-found: error
          retention-days: 7
